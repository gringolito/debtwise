name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'go.work'
      - 'go.work.sum'
      - 'mise.toml'
      - '.tool-versions'
      - '.github/workflows/backend-ci.yaml'
      - '.github/go-test-matcher.json'
  # The coverage gate compares a pull request against the last run on main.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'go.work'
      - 'go.work.sum'
      - 'mise.toml'
      - '.tool-versions'
      - '.github/workflows/backend-ci.yaml'
      - '.github/go-test-matcher.json'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run lint:backend

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run verify:format:backend

  sqlc-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run verify:sqlc

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: echo "::add-matcher::.github/go-test-matcher.json"
      # CI keeps the go test -json events: the matcher and the summary report both read them.
      - run: mise run test:backend -json | tee test-report.json
        shell: bash
        working-directory: backend
      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Backend tests
          path: backend/test-report.json
          reporter: golang-json
          list-tests: failed
          fail-on-error: 'false'
      - uses: gringolito/go-covergrid@27cbd1e65c11caa9eab2fff3771ae7d2dad15278 # v1.2.1
        with:
          profile: backend/cover.out
          config: ./backend/.testcoverage.yml
          diff-threshold: '-1.0'
          attachment-token: ${{ secrets.COVERGRID_ATTACHMENT_TOKEN }}
