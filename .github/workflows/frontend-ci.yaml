name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'mise.toml'
      - '.github/workflows/frontend-ci.yaml'
  # The coverage report compares a pull request against the last run on main.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'mise.toml'
      - '.github/workflows/frontend-ci.yaml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run lint:frontend

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run verify:format:frontend

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run test:frontend
      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Frontend tests
          path: frontend/reports/junit.xml
          reporter: jest-junit
          list-tests: failed
          fail-on-error: 'false'
      - name: Coverage grid map
        uses: gringolito/js-covergrid@98e0f57c27bd7a13c3bb96f74918a56e7d31fbc5 # v0.0.1
        with:
          coverage-summary: frontend/coverage/coverage-summary.json
          attachment-token: ${{ secrets.COVERGRID_ATTACHMENT_TOKEN }}
