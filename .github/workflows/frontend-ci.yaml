name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'mise.toml'
      - '.github/workflows/frontend-ci.yaml'
  # The coverage report compares a pull request against the last run on main.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'mise.toml'
      - '.github/workflows/frontend-ci.yaml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run lint:frontend

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run verify:format:frontend

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run test:frontend
      - name: Upload main coverage baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: error
      - name: Download main coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow frontend-ci.yaml \
            --branch main --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name frontend-coverage --dir coverage-main; then
            echo "path=coverage-main/coverage-summary.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No main coverage baseline found; reporting without comparison."
          fi
      - name: Report coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          working-directory: frontend
          json-summary-compare-path: ${{ steps.baseline.outputs.path }}
