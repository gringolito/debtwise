name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'mise.toml'
      - '.github/workflows/frontend-ci.yaml'
  # The coverage report compares a pull request against the last run on main.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'mise.toml'
      - '.github/workflows/frontend-ci.yaml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run lint:frontend

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run verify:format:frontend

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run test:frontend
      - name: Coverage grid map
        if: always()
        uses: gringolito/js-covergrid@98e0f57c27bd7a13c3bb96f74918a56e7d31fbc5 # v0.0.1
        with:
          coverage-summary: frontend/coverage/coverage-summary.json
          attachment-token: ${{ secrets.COVERGRID_ATTACHMENT_TOKEN }}
