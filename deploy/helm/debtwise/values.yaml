nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# The images run as the distroless nonroot user (65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# One pod runs the server and web containers. The server keeps its data in one SQLite file, so the
# pod always runs as a single replica.
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The API server.
server:
  image:
    repository: ghcr.io/gringolito/debtwise/server
    # Defaults to the chart's appVersion.
    tag: ""
    # `edge` is a moving tag, so the default pulls on every pod start.
    pullPolicy: Always
  # debug, info, warn or error.
  logLevel: info
  extraEnv: []
  resources: {}

# Caddy serving the frontend and proxying /api to the server over localhost.
web:
  image:
    repository: ghcr.io/gringolito/debtwise/web
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: Always
  resources: {}

service:
  type: ClusterIP
  port: 80

persistence:
  # Without persistence the database lives in an emptyDir and is lost with the pod.
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  # Empty uses the cluster's default StorageClass; "-" sets storageClassName: "".
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  # Leave the claim, and the database on it, in place on `helm uninstall`.
  keepOnUninstall: true
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: debtwise.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: debtwise-tls
  #    hosts:
  #      - debtwise.local
