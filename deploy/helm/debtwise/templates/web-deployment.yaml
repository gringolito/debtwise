apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "debtwise.web.fullname" . }}
  labels:
    {{- include "debtwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "debtwise.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "debtwise.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "debtwise.image" (dict "image" .Values.web.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- /*
          Caddy carries the cap_net_bind_service file capability to listen on port 80 as non-root,
          and exec fails unless the container keeps that capability.
          */}}
          {{- $caps := .Values.securityContext.capabilities | default dict }}
          {{- $add := append ($caps.add | default list) "NET_BIND_SERVICE" | uniq }}
          securityContext:
            {{- toYaml (merge (dict "capabilities" (dict "add" $add)) .Values.securityContext) | nindent 12 }}
          env:
            - name: BACKEND_UPSTREAM
              value: "{{ include "debtwise.server.fullname" . }}:{{ .Values.server.service.port }}"
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
