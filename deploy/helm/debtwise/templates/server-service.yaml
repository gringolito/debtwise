apiVersion: v1
kind: Service
metadata:
  name: {{ include "debtwise.server.fullname" . }}
  labels:
    {{- include "debtwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
  selector:
    {{- include "debtwise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
