apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "debtwise.fullname" . }}
  labels:
    {{- include "debtwise.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A second pod must not open the SQLite file, or attach the ReadWriteOnce claim, while the old one
  # still runs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "debtwise.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "debtwise.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "debtwise.image" (dict "image" .Values.server.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DB_PATH
              value: /data/debtwise.db
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: server-tmp
              mountPath: /tmp
        - name: web
          image: {{ include "debtwise.image" (dict "image" .Values.web.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- /*
          Caddy carries the cap_net_bind_service file capability to listen on port 80 as non-root,
          and exec fails unless the container keeps that capability.
          */}}
          {{- $caps := .Values.securityContext.capabilities | default dict }}
          {{- $add := append ($caps.add | default list) "NET_BIND_SERVICE" | uniq }}
          securityContext:
            {{- toYaml (merge (dict "capabilities" (dict "add" $add)) .Values.securityContext) | nindent 12 }}
          env:
            - name: BACKEND_UPSTREAM
              value: localhost:8080
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: web-tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "debtwise.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: server-tmp
          emptyDir: {}
        - name: web-tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
