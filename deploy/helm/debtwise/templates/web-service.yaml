apiVersion: v1
kind: Service
metadata:
  name: {{ include "debtwise.web.fullname" . }}
  labels:
    {{- include "debtwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "debtwise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
